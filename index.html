<title>Arrendar em Lisboa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho + painel de filtros + lista de linhas (preço à esquerda, detalhe ao centro, ações à direita) */
:root {
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --ink: #14202E;
  --muted: #5B6877;
  --line: #D9DEE4;
  --accent: #1F4FB4;
  --accent-ink: #FFFFFF;
  --tram: #D99A00;
  --novo-bg: #FFF1C2;
  --novo-ink: #5C4300;
  --chip: #E8EDF5;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1620; --surface: #17212D; --ink: #E8EDF3; --muted: #93A0B0; --line: #263243;
    --accent: #7AA2F7; --accent-ink: #0F1620; --tram: #F2B705; --novo-bg: #3A2E06; --novo-ink: #F6D675; --chip: #202C3B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1620; --surface: #17212D; --ink: #E8EDF3; --muted: #93A0B0; --line: #263243;
  --accent: #7AA2F7; --accent-ink: #0F1620; --tram: #F2B705; --novo-bg: #3A2E06; --novo-ink: #F6D675; --chip: #202C3B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 6vw, 40px); line-height: 1.05; margin: 0; text-wrap: balance; }
.load { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font-weight: 500; text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 8px; font-size: 13px; }

.notice { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
.notice strong { color: var(--ink); }
.notice code { font-family: var(--font-mono); font-size: 13px; background: var(--chip); padding: 1px 5px; border-radius: 4px; color: var(--ink); }
.paste { display: flex; flex-direction: column; gap: 8px; }
.paste textarea { width: 100%; min-height: 110px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-family: var(--font-mono); font-size: 12px; }
body.dragging .wrap::after { content: "Largue o ficheiro CSV aqui"; position: fixed; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 88%, transparent); font-family: var(--font-display); font-size: 28px; z-index: 20; border: 3px dashed var(--accent); }

.filters { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .group-label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input, .field select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
.groups { display: flex; flex-wrap: wrap; gap: 12px 28px; }
.group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.toggle { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 14px; }
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

.summary { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; font-size: 14px; color: var(--muted); }
.summary b { font-family: var(--font-mono); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.row {
  display: grid; grid-template-columns: 8.5rem minmax(0, 1fr) auto; gap: 6px 16px; align-items: start;
  padding: 14px 16px; border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.row.is-hidden { opacity: .55; }
.price { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.eur { font-family: var(--font-mono); font-weight: 600; font-size: 24px; line-height: 1.1; }
.unit { font-size: 12px; color: var(--muted); }
.main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.title { font-weight: 500; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
a.title:hover { color: var(--accent); text-decoration: underline; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tipo { font-family: var(--font-mono); font-weight: 600; font-size: 13px; background: var(--chip); color: var(--ink); border-radius: 4px; padding: 1px 7px; }
.portal { text-transform: capitalize; }
.novo { background: var(--novo-bg); color: var(--novo-ink); border-radius: 4px; padding: 1px 7px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.also { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.actions { display: flex; gap: 6px; }
.icon-btn { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.icon-btn:hover { border-color: var(--accent); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.icon-btn[aria-pressed="true"] { color: var(--ink); border-color: var(--tram); }
.icon-btn[aria-pressed="true"] svg { fill: var(--tram); stroke: var(--tram); }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.foot { font-size: 12px; color: var(--muted); }

@media (max-width: 600px) {
  .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "price actions" "main main"; }
  .row .price { grid-area: price; flex-direction: row; align-items: baseline; gap: 8px; }
  .row .actions { grid-area: actions; }
  .row .main { grid-area: main; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .toggle, .icon-btn { transition: border-color .15s, background-color .15s; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Apartamentos para arrendar</p>
      <h1>Arrendar em Lisboa</h1>
    </div>
    <div class="load">
      <label class="btn primary" for="file">Carregar CSV</label>
      <input id="file" type="file" accept=".csv,text/csv,text/plain" hidden>
      <button class="btn" id="pasteToggle" type="button" aria-expanded="false" aria-controls="pasteBox">Colar texto</button>
    </div>
  </header>

  <div class="paste" id="pasteBox" hidden>
    <textarea id="pasteArea" placeholder="Cole aqui o conteúdo de imoveis_lisboa.csv"></textarea>
    <div><button class="btn small primary" id="pasteGo" type="button">Usar este texto</button></div>
  </div>

  <div class="notice" id="notice"></div>

  <section class="filters" aria-label="Filtros">
    <div class="fields">
      <div class="field"><label for="q">Pesquisa</label><input id="q" type="search" placeholder="Bairro, rua, palavra"></div>
      <div class="field"><label for="pmin">Preço mín. (€)</label><input id="pmin" type="number" inputmode="numeric" min="0" step="50"></div>
      <div class="field"><label for="pmax">Preço máx. (€)</label><input id="pmax" type="number" inputmode="numeric" min="0" step="50"></div>
      <div class="field"><label for="amin">Área mín. (m²)</label><input id="amin" type="number" inputmode="numeric" min="0" step="5"></div>
      <div class="field"><label for="sort">Ordenar por</label>
        <select id="sort">
          <option value="preco">Preço, mais baixo</option>
          <option value="preco-desc">Preço, mais alto</option>
          <option value="ppm">€/m², mais baixo</option>
          <option value="area">Área, maior</option>
          <option value="novos">Novos primeiro</option>
        </select>
      </div>
    </div>
    <div class="groups">
      <div class="group"><span class="group-label" id="tipoLabel">Tipologia</span><div class="chips" id="tipoChips" role="group" aria-labelledby="tipoLabel"></div></div>
      <div class="group"><span class="group-label" id="portalLabel">Portal</span><div class="chips" id="portalChips" role="group" aria-labelledby="portalLabel"></div></div>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="favOnly"> Só guardados</label>
      <label><input type="checkbox" id="onlyNew"> Só novos</label>
      <label><input type="checkbox" id="showHidden"> Mostrar ocultos</label>
      <button class="btn small" type="button" id="clear">Limpar filtros</button>
    </div>
  </section>

  <div class="summary" id="summary" aria-live="polite"></div>
  <ul class="list" id="list"></ul>
  <p class="foot">Os anúncios são atualizados automaticamente de 2 em 2 horas e esta página recarrega os dados a cada 10 minutos. Os guardados e ocultos ficam neste dispositivo.</p>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var nf = new Intl.NumberFormat("pt-PT");
  var nf1 = new Intl.NumberFormat("pt-PT", { minimumFractionDigits: 1, maximumFractionDigits: 1 });

  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  var SAMPLE = [
    ["idealista", "Apartamento T1 remodelado em Arroios", 1150, 52, 1, ""],
    ["imovirtual", "T2 com varanda junto ao Jardim do Campo Grande", 1380, 78, 2, ""],
    ["casa_sapo", "T0 mobilado em Alfama", 890, 34, 0, ""],
    ["olx", "T1 luminoso em Campo de Ourique", 1250, 56, 1, "supercasa"],
    ["supercasa", "T3 com garagem em Benfica", 1750, 115, 3, ""],
    ["remax", "T2 renovado em Alvalade", 1450, 82, 2, ""],
    ["custojusto", "T1 perto do metro, Olaias", 980, 48, 1, ""],
    ["idealista", "T2 duplex em Santos", 1690, 90, 2, ""],
    ["century21", "T2 em Marvila, vista rio", 1290, 74, 2, ""],
    ["imovirtual", "T1 em Penha de França", 1020, 50, 1, ""],
    ["olx", "Quarto grande e T0 em Anjos", 760, 30, 0, ""],
    ["casa_sapo", "T4 em Telheiras", 2300, 160, 4, ""]
  ];

  var data = [];
  var meta = { name: "", at: "", example: false };
  var favs = new Set(store.get("cl_favs", []));
  var hid = new Set(store.get("cl_hidden", []));
  var seen = new Set(store.get("cl_seen", []));
  var F = { q: "", pmin: null, pmax: null, amin: null, tipos: new Set(), portais: new Set(), favOnly: false, onlyNew: false, showHidden: false, sort: "preco" };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
  function tipoKey(t) { return t == null ? "x" : String(Math.min(t, 4)); }
  function tipoLabel(k) { return k === "x" ? "?" : k === "4" ? "T4+" : "T" + k; }
  function portalName(p) { return String(p || "").replace(/_/g, " "); }

  function parseCSV(text) {
    text = String(text || "").replace(/^﻿/, "");
    var rows = [], row = [], cur = "", q = false, i, c;
    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else { q = false; } }
        else { cur += c; }
      } else if (c === '"') { q = true; }
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cur); cur = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else { cur += c; }
    }
    if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

  function toListings(rows) {
    if (!rows.length) return [];
    var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
    var ix = function (n) { return head.indexOf(n); };
    var cP = ix("portal"), cT = ix("titulo"), cPr = ix("preco"), cA = ix("area_m2"), cTi = ix("tipologia"), cU = ix("url"), cO = ix("outros_portais"), cV = ix("visto_em");
    if (cPr < 0 || cU < 0) return null;
    var out = [];
    rows.slice(1).forEach(function (r) {
      var url = safeUrl((r[cU] || "").trim());
      var preco = parseInt(String(r[cPr] || "").replace(/\D/g, ""), 10);
      if (!url || !preco) return;
      var area = parseFloat(String(r[cA] || "").replace(",", "."));
      var tipo = parseInt(r[cTi], 10);
      var outros = [];
      String(r[cO] || "").split(" | ").forEach(function (part) {
        var k = part.indexOf(": ");
        if (k > 0) { var u = safeUrl(part.slice(k + 2).trim()); if (u) outros.push({ portal: part.slice(0, k).trim(), url: u }); }
      });
      out.push({ url: url, portal: (r[cP] || "").trim(), titulo: (r[cT] || "").trim() || url, preco: preco, area: isNaN(area) ? null : area, tipo: isNaN(tipo) ? null : tipo, outros: outros, novo: false, example: false, visto: cV >= 0 ? (r[cV] || "").trim() : undefined });
    });
    return out;
  }

  function loadText(text, name, at) {
    var list = toListings(parseCSV(text));
    if (list === null) { showError("Não encontrei as colunas preco e url. Use o ficheiro imoveis_lisboa.csv gerado pelo script."); return; }
    if (!list.length) { showError("O ficheiro não tem anúncios válidos."); return; }
    var hadSeen = seen.size > 0;
    list.forEach(function (l) {
      if (l.visto !== undefined) {
        // o scraper regista quando viu cada anúncio pela 1.ª vez; "novo" = últimas 48 h
        var t = Date.parse(l.visto);
        l.novo = !isNaN(t) && Date.now() - t < 48 * 3600 * 1000;
      } else {
        l.novo = hadSeen && !seen.has(l.url);
      }
      seen.add(l.url);
    });
    store.set("cl_seen", Array.from(seen));
    data = list;
    meta = { name: name || "texto colado", at: at || new Date().toISOString(), example: false };
    store.set("cl_data", { list: data, meta: meta });
    resetFiltersForData();
    render();
  }

  function loadSample() {
    data = SAMPLE.map(function (s, i) {
      return { url: "exemplo-" + i, portal: s[0], titulo: s[1], preco: s[2], area: s[3], tipo: s[4], outros: s[5] ? [{ portal: s[5], url: "" }] : [], novo: i === 3 || i === 8, example: true };
    });
    meta = { name: "", at: "", example: true };
  }

  var errorMsg = "";
  function showError(m) { errorMsg = m; renderNotice(); }

  function renderNotice() {
    var n = $("#notice");
    if (errorMsg) { n.innerHTML = "<strong>Não foi possível carregar.</strong> " + esc(errorMsg); return; }
    if (meta.example) {
      n.innerHTML = "<strong>Dados de exemplo.</strong> Corra <code>python imoveis_lisboa.py</code> no seu computador e carregue aqui o ficheiro <code>imoveis_lisboa.csv</code>. Também pode largar o ficheiro nesta página.";
    } else {
      var d = meta.at ? new Date(meta.at).toLocaleString("pt-PT", { dateStyle: "short", timeStyle: "short" }) : "";
      n.innerHTML = "<strong>" + esc(meta.name) + "</strong> carregado em " + esc(d) + ". " + nf.format(data.length) + " anúncios.";
    }
  }

  function resetFiltersForData() {
    F.tipos.clear(); F.portais.clear();
    errorMsg = "";
  }

  function visible() {
    var q = F.q.trim().toLowerCase();
    var out = data.filter(function (l) {
      if (!F.showHidden && hid.has(l.url)) return false;
      if (F.favOnly && !favs.has(l.url)) return false;
      if (F.onlyNew && !l.novo) return false;
      if (F.pmin != null && l.preco < F.pmin) return false;
      if (F.pmax != null && l.preco > F.pmax) return false;
      if (F.amin != null && (l.area == null || l.area < F.amin)) return false;
      if (F.tipos.size && !F.tipos.has(tipoKey(l.tipo))) return false;
      if (F.portais.size && !F.portais.has(l.portal)) return false;
      if (q && (l.titulo + " " + l.portal).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var ppm = function (l) { return l.area ? l.preco / l.area : Infinity; };
    var cmp = {
      "preco": function (a, b) { return a.preco - b.preco; },
      "preco-desc": function (a, b) { return b.preco - a.preco; },
      "ppm": function (a, b) { return ppm(a) - ppm(b); },
      "area": function (a, b) { return (b.area || 0) - (a.area || 0); },
      "novos": function (a, b) { return (b.novo ? 1 : 0) - (a.novo ? 1 : 0) || a.preco - b.preco; }
    }[F.sort];
    return out.sort(cmp);
  }

  function median(arr) {
    if (!arr.length) return null;
    var s = arr.slice().sort(function (a, b) { return a - b; }), m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2);
  }

  function renderChips() {
    var tipos = {};
    data.forEach(function (l) { tipos[tipoKey(l.tipo)] = true; });
    var order = ["0", "1", "2", "3", "4", "x"].filter(function (k) { return tipos[k]; });
    $("#tipoChips").innerHTML = order.map(function (k) {
      return '<button type="button" class="toggle" data-tipo="' + k + '" aria-pressed="' + F.tipos.has(k) + '">' + tipoLabel(k) + "</button>";
    }).join("");
    var ps = [];
    data.forEach(function (l) { if (l.portal && ps.indexOf(l.portal) < 0) ps.push(l.portal); });
    ps.sort();
    $("#portalChips").innerHTML = ps.map(function (p) {
      return '<button type="button" class="toggle" data-portal="' + esc(p) + '" aria-pressed="' + F.portais.has(p) + '">' + esc(portalName(p)) + "</button>";
    }).join("");
  }

  var ICON_STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.5 6 .8-4.4 4.1 1.1 5.9L12 16.9 6.7 19.8l1.1-5.9L3.4 9.8l6-.8z"/></svg>';
  var ICON_EYE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.6-6 9-6 9 6 9 6-3.6 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.6"/></svg>';

  function renderList() {
    var list = visible();
    var all = data.length;
    var prices = list.map(function (l) { return l.preco; });
    var med = median(prices);
    var min = prices.length ? Math.min.apply(null, prices) : null;
    var nNovos = list.filter(function (l) { return l.novo; }).length;
    $("#summary").innerHTML =
      "<span><b>" + nf.format(list.length) + "</b> de " + nf.format(all) + " anúncios</span>" +
      (med != null ? "<span>Mediana <b>" + nf.format(med) + " €</b></span><span>Mais barato <b>" + nf.format(min) + " €</b></span>" : "") +
      (nNovos ? "<span><b>" + nNovos + "</b> novos</span>" : "");

    var ul = $("#list");
    if (!list.length) {
      ul.innerHTML = '<li class="empty"><span>Nenhum anúncio com estes filtros.</span><button class="btn small" type="button" data-act="clear">Limpar filtros</button></li>';
      return;
    }
    ul.innerHTML = list.map(function (l) {
      var isFav = favs.has(l.url), isHid = hid.has(l.url);
      var href = l.example ? "" : safeUrl(l.url);
      var title = href ? '<a class="title" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(l.titulo) + "</a>" : '<span class="title">' + esc(l.titulo) + "</span>";
      var ppm = l.area ? nf1.format(l.preco / l.area) + " €/m²" : "";
      var also = l.outros.length ? '<div class="also"><span>Também em</span>' + l.outros.map(function (o) {
        return o.url ? '<a href="' + esc(o.url) + '" target="_blank" rel="noopener noreferrer">' + esc(portalName(o.portal)) + "</a>" : "<span>" + esc(portalName(o.portal)) + "</span>";
      }).join("") + "</div>" : "";
      return '<li class="row' + (isHid ? " is-hidden" : "") + '" data-url="' + esc(l.url) + '">' +
        '<div class="price"><span class="eur">' + nf.format(l.preco) + ' €</span><span class="unit">por mês</span></div>' +
        '<div class="main">' + title +
        '<div class="meta"><span class="tipo">' + (l.tipo == null ? "T?" : "T" + l.tipo) + "</span>" +
        (l.area ? "<span>" + nf.format(Math.round(l.area)) + " m²</span>" : "") +
        (ppm ? "<span>" + ppm + "</span>" : "") +
        '<span class="portal">' + esc(portalName(l.portal)) + "</span>" +
        (l.novo ? '<span class="novo">Novo</span>' : "") + "</div>" + also + "</div>" +
        '<div class="actions">' +
        '<button type="button" class="icon-btn" data-act="fav" aria-pressed="' + isFav + '" aria-label="' + (isFav ? "Remover dos guardados" : "Guardar") + '">' + ICON_STAR + "</button>" +
        '<button type="button" class="icon-btn" data-act="hide" aria-pressed="' + isHid + '" aria-label="' + (isHid ? "Repor anúncio" : "Ocultar anúncio") + '" title="' + (isHid ? "Repor" : "Ocultar") + '">' + ICON_EYE + "</button>" +
        "</div></li>";
    }).join("");
  }

  function render() { renderNotice(); renderChips(); renderList(); }

  function readNum(id) { var v = parseFloat($(id).value); return isNaN(v) ? null : v; }
  function syncInputs() {
    $("#q").value = F.q; $("#pmin").value = F.pmin == null ? "" : F.pmin; $("#pmax").value = F.pmax == null ? "" : F.pmax;
    $("#amin").value = F.amin == null ? "" : F.amin; $("#sort").value = F.sort;
    $("#favOnly").checked = F.favOnly; $("#onlyNew").checked = F.onlyNew; $("#showHidden").checked = F.showHidden;
  }
  function clearFilters() {
    F.q = ""; F.pmin = F.pmax = F.amin = null; F.tipos.clear(); F.portais.clear();
    F.favOnly = F.onlyNew = F.showHidden = false;
    syncInputs(); renderChips(); renderList();
  }

  $("#q").addEventListener("input", function (e) { F.q = e.target.value; renderList(); });
  $("#pmin").addEventListener("input", function () { F.pmin = readNum("#pmin"); renderList(); });
  $("#pmax").addEventListener("input", function () { F.pmax = readNum("#pmax"); renderList(); });
  $("#amin").addEventListener("input", function () { F.amin = readNum("#amin"); renderList(); });
  $("#sort").addEventListener("change", function (e) { F.sort = e.target.value; renderList(); });
  $("#favOnly").addEventListener("change", function (e) { F.favOnly = e.target.checked; renderList(); });
  $("#onlyNew").addEventListener("change", function (e) { F.onlyNew = e.target.checked; renderList(); });
  $("#showHidden").addEventListener("change", function (e) { F.showHidden = e.target.checked; renderList(); });
  $("#clear").addEventListener("click", clearFilters);

  function toggleIn(set, v) { if (set.has(v)) set.delete(v); else set.add(v); }
  $("#tipoChips").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tipo]"); if (!b) return;
    toggleIn(F.tipos, b.getAttribute("data-tipo")); renderChips(); renderList();
  });
  $("#portalChips").addEventListener("click", function (e) {
    var b = e.target.closest("[data-portal]"); if (!b) return;
    toggleIn(F.portais, b.getAttribute("data-portal")); renderChips(); renderList();
  });

  $("#list").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "clear") { clearFilters(); return; }
    var row = b.closest(".row"); if (!row) return;
    var url = row.getAttribute("data-url");
    if (act === "fav") { toggleIn(favs, url); store.set("cl_favs", Array.from(favs)); }
    if (act === "hide") { toggleIn(hid, url); store.set("cl_hidden", Array.from(hid)); }
    renderList();
  });

  function readFile(f) {
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { loadText(String(r.result), f.name); };
    r.onerror = function () { showError("Não consegui ler o ficheiro."); };
    r.readAsText(f, "utf-8");
  }
  $("#file").addEventListener("change", function (e) { readFile(e.target.files[0]); e.target.value = ""; });

  $("#pasteToggle").addEventListener("click", function () {
    var box = $("#pasteBox"); box.hidden = !box.hidden;
    this.setAttribute("aria-expanded", String(!box.hidden));
    if (!box.hidden) $("#pasteArea").focus();
  });
  $("#pasteGo").addEventListener("click", function () {
    var t = $("#pasteArea").value;
    if (!t.trim()) { showError("Cole primeiro o conteúdo do CSV."); return; }
    loadText(t, "texto colado");
    $("#pasteBox").hidden = true; $("#pasteToggle").setAttribute("aria-expanded", "false");
  });

  var depth = 0;
  window.addEventListener("dragenter", function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") >= 0) { depth++; document.body.classList.add("dragging"); } });
  window.addEventListener("dragleave", function () { depth = Math.max(0, depth - 1); if (!depth) document.body.classList.remove("dragging"); });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) {
    e.preventDefault(); depth = 0; document.body.classList.remove("dragging");
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
  });

  var saved = store.get("cl_data", null);
  if (saved && saved.list && saved.list.length) { data = saved.list; meta = saved.meta || { name: "último ficheiro", at: "", example: false }; }
  else { loadSample(); }
  syncInputs();
  render();

  // Atualização automática: o repositório publica imoveis_lisboa.csv e meta.json ao lado desta página.
  function autoLoad() {
    var bust = "?t=" + Date.now();
    Promise.all([
      fetch("imoveis_lisboa.csv" + bust, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("csv"); return r.text(); }),
      fetch("meta.json" + bust, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
    ]).then(function (res) {
      loadText(res[0], "Atualização automática", res[1].atualizado_em || res[1].updated);
    }).catch(function () { /* sem CSV publicado: mantém o último ficheiro ou os exemplos */ });
  }
  autoLoad();
  setInterval(autoLoad, 10 * 60 * 1000);
})();
</script>
