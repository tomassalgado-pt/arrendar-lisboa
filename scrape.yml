name: Atualizar anúncios

on:
  schedule:
    - cron: "0 */2 * * *"   # de 2 em 2 horas (UTC)
  workflow_dispatch:         # botão "Run workflow" para correr já

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Correr o scraper
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          # Filtros editáveis em Settings > Secrets and variables > Actions > Variables
          SCRAPER_ARGS: ${{ vars.SCRAPER_ARGS }}
        run: |
          ARGS="--browser --saida docs/imoveis_lisboa.csv --meta docs/meta.json --estado vistos.json${SCRAPER_ARGS:---max-preco 1500 --paginas 3}"
          if [ -n "$ALERT_EMAIL" ]; then ARGS="$ARGS --alerta-email $ALERT_EMAIL"; fi
          python imoveis_lisboa.py $ARGS

      - name: Publicar resultados
        run: |
          git config user.name "scraper-bot"
          git config user.email "scraper-bot@users.noreply.github.com"
          git add docs vistos.json
          git diff --cached --quiet || git commit -m "Atualiza anúncios"
          git push
